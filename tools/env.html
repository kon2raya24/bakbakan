<!doctype html><meta charset="utf-8"><body><script type="module">
// Poly Haven props (CC0, glTF at 1k) to small GLBs for the stages: textures shrunk and stored as JPEG,
// heavy meshes thinned with meshoptimizer, everything in metres, resting on the ground. Run by env-run.mjs.
import * as THREE from '../src/vendor/three.module.min.js';
import { GLTFExporter, GLTFLoader, mergeVertices } from './three-convert.js';
import { MeshoptSimplifier } from '../.scratch/node_modules/meshoptimizer/meshopt_simplifier.js';

const job = await (await fetch(new URLSearchParams(location.search).get('job'))).json();
await MeshoptSimplifier.ready;
const out = {}, log = [];
// a set (several rocks, shrubs or grass clumps side by side) becomes one prop per piece: id~0, id~1...
const work = [];
for (const p of job.props) {
  try {
    const gl = await new GLTFLoader().loadAsync(`${job.dir}${p.id}/${p.id}.gltf`);
    if (p.split) [...gl.scene.children].forEach((c, k) => { const g = new THREE.Group(); c.position.set(0, 0, 0); g.add(c); work.push({ ...p, id: `${p.id}~${k}`, root: g }); });
    else work.push({ ...p, root: gl.scene });
  } catch (e) { log.push(`${p.id}: FAILED ${e.message || e}`); }
}
for (const p of work) {
  try {
    const root = p.root;
    root.updateMatrixWorld(true);
    let tris = 0, after = 0, total = 0;
    root.traverse((o) => { if (o.isMesh) total += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    const share = Math.min(1, (p.tris || job.tris || 4000) / total); // the prop's budget, shared by its meshes
    root.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      let g = o.geometry;
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
      if (!g.index) g = mergeVertices(g, 1e-5);
      const n = g.index.count / 3; tris += n;
      const budget = Math.max(24, n * share);
      if (n > budget * 1.15) {
        const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv, attrs = new Float32Array(pos.count * 5);
        for (let i = 0; i < pos.count; i++) attrs.set([nor ? nor.getX(i) : 0, nor ? nor.getY(i) : 0, nor ? nor.getZ(i) : 0, uv ? uv.getX(i) : 0, uv ? uv.getY(i) : 0], i * 5);
        const [ni] = MeshoptSimplifier.simplifyWithAttributes(new Uint32Array(g.index.array), new Float32Array(pos.array), 3, attrs, 5, [0.5, 0.5, 0.5, 1, 1], null, Math.round(budget) * 3, 0.05);
        const used = new Map(), keep = [];
        for (const v of ni) if (!used.has(v)) { used.set(v, keep.length); keep.push(v); }
        const c = new THREE.BufferGeometry();
        for (const [k, a] of Object.entries(g.attributes)) { const s = a.itemSize, arr = new Float32Array(keep.length * s); keep.forEach((v, j) => { for (let q = 0; q < s; q++) arr[j * s + q] = a.getComponent ? a.getComponent(v, q) : a.array[v * s + q]; }); c.setAttribute(k, new THREE.BufferAttribute(arr, s)); }
        c.setIndex(Array.from(ni, (v) => used.get(v)));
        g = c;
      }
      o.geometry = g; after += g.index.count / 3;
      for (const m of [].concat(o.material)) for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap']) if (m[k] && !(k === 'map' && (m.transparent || m.alphaTest > 0))) m[k].userData.mimeType = 'image/jpeg';
    });
    // sit it on the ground at the origin
    const box = new THREE.Box3().setFromObject(root), ctr = box.getCenter(new THREE.Vector3());
    const wrap = new THREE.Group(); wrap.name = p.id; wrap.add(root); root.position.set(-ctr.x, -box.min.y, -ctr.z);
    const glb = await new GLTFExporter().parseAsync(wrap, { binary: true, maxTextureSize: p.tex || job.tex || 512 });
    const bytes = new Uint8Array(glb); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    const size = box.getSize(new THREE.Vector3());
    out[p.id] = { glb: btoa(bin), size: size.toArray().map((v) => +v.toFixed(3)), tris: after };
    log.push(`${p.id}: ${tris} → ${after} tris, ${size.toArray().map((v) => v.toFixed(2)).join(' × ')} m, ${(bytes.length / 1e3).toFixed(0)} KB`);
  } catch (e) { log.push(`${p.id}: FAILED ${e.message || e}`); }
}
window.__result = JSON.stringify({ out, log });
</script>
