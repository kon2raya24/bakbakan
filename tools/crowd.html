<!doctype html><meta charset="utf-8"><body><script type="module">
// Mixamo people to a crowd: each character frozen in a few poses (sitting and clapping, cheering,
// standing and clapping), the skinning baked into plain meshes, thinned out, in one GLB. Run by crowd-run.mjs.
import * as THREE from '../src/vendor/three.module.min.js';
import { FBXLoader, GLTFExporter, mergeVertices } from './three-convert.js';
import { MeshoptSimplifier } from '../.scratch/node_modules/meshoptimizer/meshopt_simplifier.js';

const job = await (await fetch(new URLSearchParams(location.search).get('job'))).json();
await MeshoptSimplifier.ready;
const canon = (n) => n.replace(/^mixamorig\d*[:_]?/i, '');
const fbx = new FBXLoader(), cache = {};
const load = (f) => (cache[f] ||= fbx.loadAsync(job.dir + f));
const findBone = (obj, name) => { let b = null; obj.traverse((o) => { if (!b && o.isBone && canon(o.name) === name) b = o; }); return b; };
const log = [], meta = {};
const out = new THREE.Group(); out.name = 'crowd';

// a clip from another file, bound to this character's bones (rotations, and the hips scaled to it)
function bind(clip, char, animHips, charHips) {
  const names = {}; char.traverse((o) => { if (o.isBone) names[canon(o.name)] = o.name; });
  const k = charHips.position.y / animHips.position.y, tracks = [];
  for (const t of clip.tracks) {
    const [node, prop] = t.name.split('.'), b = names[canon(node)];
    if (!b || prop === 'scale' || (prop === 'position' && canon(node) !== 'Hips')) continue;
    const c = t.clone(); c.name = `${b}.${prop}`; if (prop === 'position') c.values = c.values.map((v) => v * k); tracks.push(c);
  }
  return new THREE.AnimationClip(clip.name, clip.duration, tracks);
}

// bake the skinned meshes as they stand now, one geometry per material, in metres
const P = new THREE.Vector3(), Q = new THREE.Vector3(), N3 = new THREE.Matrix3();
function bake(char) {
  char.updateMatrixWorld(true);
  const inv = new THREE.Matrix4(), byMat = new Map(); // the character stands at the origin: world space is metres
  char.traverse((o) => {
    if (!o.isSkinnedMesh || !o.visible) return;
    o.skeleton.update();
    const g = o.geometry, pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
    const toChar = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld); N3.getNormalMatrix(toChar);
    const mats = [].concat(o.material), groups = g.groups.length ? g.groups : [{ start: 0, count: g.index ? g.index.count : pos.count, materialIndex: 0 }];
    const skinned = new Float32Array(pos.count * 3), normals = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      P.fromBufferAttribute(pos, i); o.applyBoneTransform(i, P);
      Q.fromBufferAttribute(pos, i).addScaledVector(new THREE.Vector3().fromBufferAttribute(nor, i), 0.01); o.applyBoneTransform(i, Q);
      Q.sub(P).applyMatrix3(N3).normalize(); P.applyMatrix4(toChar);
      skinned.set([P.x, P.y, P.z], i * 3); normals.set([Q.x, Q.y, Q.z], i * 3);
    }
    for (const gr of groups) {
      const m = mats[gr.materialIndex || 0];
      if (!byMat.has(m)) byMat.set(m, []);
      const idx = []; for (let j = gr.start; j < gr.start + gr.count; j++) idx.push(g.index ? g.index.getX(j) : j);
      byMat.get(m).push({ skinned, normals, uv, idx });
    }
  });
  return byMat;
}

// one geometry from the pieces, welded, then thinned to about its share of the triangle budget
function build(pieces, share) {
  const pos = [], nor = [], uv = [], idx = [];
  for (const p of pieces) {
    const map = new Map();
    for (const i of p.idx) {
      if (!map.has(i)) { map.set(i, pos.length / 3); pos.push(p.skinned[i * 3], p.skinned[i * 3 + 1], p.skinned[i * 3 + 2]); nor.push(p.normals[i * 3], p.normals[i * 3 + 1], p.normals[i * 3 + 2]); if (p.uv) uv.push(p.uv.getX(i), p.uv.getY(i)); else uv.push(0, 0); }
      idx.push(map.get(i));
    }
  }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  g = mergeVertices(g, 1e-4);
  const tris = g.index.count / 3, target = Math.max(60, Math.round(share)) * 3;
  if (g.index.count > target) {
    const P3 = g.attributes.position.array, attrs = new Float32Array(g.attributes.position.count * 5);
    for (let i = 0; i < g.attributes.position.count; i++) { attrs.set([g.attributes.normal.getX(i), g.attributes.normal.getY(i), g.attributes.normal.getZ(i), g.attributes.uv.getX(i), g.attributes.uv.getY(i)], i * 5); }
    const [ni] = MeshoptSimplifier.simplifyWithAttributes(new Uint32Array(g.index.array), P3, 3, attrs, 5, [0.3, 0.3, 0.3, 1, 1], null, target, 0.06);
    g.setIndex(new THREE.BufferAttribute(ni, 1));
  }
  // keep only the vertices the triangles still use
  const used = new Map(), ix = g.index.array, keep = [];
  for (let i = 0; i < ix.length; i++) { if (!used.has(ix[i])) { used.set(ix[i], keep.length); keep.push(ix[i]); } }
  const c = new THREE.BufferGeometry();
  for (const [k, a] of Object.entries(g.attributes)) { const n = a.itemSize, arr = new Float32Array(keep.length * n); keep.forEach((v, j) => { for (let q = 0; q < n; q++) arr[j * n + q] = a.array[v * n + q]; }); c.setAttribute(k, new THREE.BufferAttribute(arr, n)); }
  c.setIndex(Array.from(ix, (v) => used.get(v)));
  g = c;
  log.push(`  ${tris} → ${g.index.count / 3} tris`);
  return g;
}

// the moment in a clip that shows a pose best
function pick(clip, char, mixer, want) {
  const L = findBone(char, 'LeftHand'), R = findBone(char, 'RightHand'), a = mixer.clipAction(clip); a.play();
  let best = 0, bestV = want === 'closed' ? Infinity : -Infinity;
  const p = new THREE.Vector3(), q = new THREE.Vector3();
  for (let t = 0; t <= clip.duration; t += 1 / 30) {
    mixer.setTime(t); char.updateMatrixWorld(true); L.getWorldPosition(p); R.getWorldPosition(q);
    const v = want === 'up' ? p.y + q.y : p.distanceTo(q);
    if (want === 'closed' ? v < bestV : v > bestV) { bestV = v; best = t; }
  }
  mixer.setTime(best); char.updateMatrixWorld(true);
  return best;
}

const matCache = new Map();
const matFor = (m) => {
  if (matCache.has(m)) return matCache.get(m);
  const map = m.map && m.map.image && (m.map.image.width > 0 || m.map.image.data) ? m.map : null;
  const n = new THREE.MeshStandardMaterial({ map, color: map ? 0xffffff : (m.color || new THREE.Color(0x888888)), roughness: 0.8, metalness: 0, transparent: !!m.transparent || (m.opacity ?? 1) < 1, alphaTest: m.alphaTest || (m.transparent ? 0.5 : 0), side: THREE.FrontSide });
  if (n.map) n.map.colorSpace = THREE.SRGBColorSpace;
  if (n.transparent) { n.transparent = false; n.alphaTest = 0.5; } else if (n.map) n.map.userData.mimeType = 'image/jpeg';
  n.name = m.name; matCache.set(m, n); return n;
};

for (const ch of job.chars) {
  const char = await load(ch.file);
  const pending = [];
  char.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) for (const k of Object.keys(m)) { const t = m[k]; if (t && t.isTexture && t.image && t.image.decode && !t.image.complete) pending.push(t.image.decode().catch(() => {})); } });
  await Promise.all(pending); await new Promise((r) => setTimeout(r, 200));
  char.animations = []; char.scale.setScalar(0.01); char.position.set(0, 0, 0); char.rotation.set(0, 0, 0); char.updateMatrixWorld(true);
  // every one at their own real height, whatever units the file uses
  const box0 = new THREE.Box3().setFromObject(char); char.scale.multiplyScalar(ch.height / (box0.max.y - box0.min.y)); char.updateMatrixWorld(true);
  const hips = findBone(char, 'Hips'), rest = new THREE.Box3().setFromObject(char), height = rest.max.y - rest.min.y;
  meta[ch.id] = { height: +height.toFixed(3), poses: {} };
  const group = new THREE.Group(); group.name = ch.id; out.add(group);
  log.push(`${ch.id}: ${height.toFixed(2)} m`);
  for (const ps of job.poses) {
    const anim = await load(ps.file), clip = bind(anim.animations[0], char, findBone(anim, 'Hips'), hips);
    const mixer = new THREE.AnimationMixer(char), t = pick(clip, char, mixer, ps.want);
    const byMat = bake(char), pose = new THREE.Group(); pose.name = `${ch.id}|${ps.id}`;
    const total = [...byMat.values()].reduce((a, ps2) => a + ps2.reduce((b, p) => b + p.idx.length / 3, 0), 0);
    for (const [m, pieces] of byMat) {
      const tri = pieces.reduce((b, p) => b + p.idx.length / 3, 0);
      const mesh = new THREE.Mesh(build(pieces, job.tris * tri / total), matFor(m)); mesh.name = `${ch.id}|${ps.id}|${m.name}`; pose.add(mesh);
    }
    group.add(pose);
    const hp = new THREE.Vector3(); hips.getWorldPosition(hp);
    const box = new THREE.Box3().setFromObject(pose);
    meta[ch.id].poses[ps.id] = { t: +t.toFixed(2), hips: [+hp.x.toFixed(3), +hp.y.toFixed(3), +hp.z.toFixed(3)], min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)) };
    mixer.stopAllAction(); mixer.uncacheRoot(char);
    log.push(` ${ps.id} @${t.toFixed(2)}s hips ${hp.y.toFixed(2)}`);
  }
}
const glb = await new GLTFExporter().parseAsync(out, { binary: true, maxTextureSize: job.maxTexture || 512 });
const bytes = new Uint8Array(glb); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
log.push(`crowd.glb ${(bytes.length / 1e6).toFixed(2)} MB`);
window.__result = JSON.stringify({ glb: btoa(bin), meta, log });
</script>
